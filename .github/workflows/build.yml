name: Sync Benchmarks Probing Memes

on:
  push:
    branches: [ main ]

jobs:
  sync-backend:
    name: Sync backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync backend to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USER }}
          REMOTE_PORT: ${{ secrets.PORT }}
          SOURCE: "backend/"
          TARGET: ${{ secrets.TARGET_BACKEND }}
          ARGS: >-
            -rlgoDzvc
            --delete
            --exclude=.git
            --exclude=.github
            --exclude=.venv
            --exclude=__pycache__
            --exclude=.env
            --exclude=.python-version

  sync-frontend:
    name: Sync frontend, build and restart
    runs-on: ubuntu-latest
    needs: sync-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync frontend to server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.HOST }}
          REMOTE_USER: ${{ secrets.USER }}
          REMOTE_PORT: ${{ secrets.PORT }}
          SOURCE: "frontend/"
          TARGET: ${{ secrets.TARGET_FRONTEND }}
          ARGS: >-
            -rlgoDzvc
            --delete
            --exclude=.git
            --exclude=.github
            --exclude=node_modules
            --exclude=.next
            --exclude=.env
            --exclude=.env.local
            --exclude=.env.production
            --exclude=.env.development
          SCRIPT_AFTER: |
            set -e
            cd "${{ secrets.TARGET_FRONTEND }}"
            npm ci
            npm run build
            ${{ secrets.FRONTEND_RESTART_CMD }}
          SCRIPT_AFTER_REQUIRED: true